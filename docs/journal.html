<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наша работа</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* HEADER */
    .header {
        width: 100%;
        height: 70px;
        background: linear-gradient(90deg, #00ffb3, #00e0ff);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 80px;
    }

    .header a {
        text-decoration: none;
        color: black;
        margin: 0 20px;
        font-size: 20px;
        font-weight: bold;
    }

    /* MAIN */
    .wrapper {
        width: 1920px;
        max-width: 100%;
        margin: 0 auto;
        flex: 1;
        padding-bottom: 60px;
    }

    h1 {
        text-align: center;
        margin-top: 60px;
        font-size: 36px;
    }

    /* GALLERY */
    .gallery {
        display: flex;
        justify-content: center;
        gap: 400px;
        margin-top: 60px;
        flex-wrap: wrap;
    }

    .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 200px;
    }

    /* FIXED IMAGE BOX */
    .img {
        width: 550px;
        height: 450px;
        border: 2px dashed #0a7a4b;
        border-radius: 10px;
        overflow: hidden;
        background: #f5f5f5;
    }

    .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .caption {
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
    }

    /* FOOTER */
    .footer {
        width: 100%;
        background: #8c8c8c;
        padding: 20px 80px;
        font-size: 18px;
    }
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>
        <a href="./index.html">Главная</a>
    </div>

    <div>
        <a href="./about.html">О проекте</a>
        <a href="./journal.html">Журнал</a>
        <a href="./members.html">Участники</a>
        <a href="./resources.html">Ресурсы</a>
    </div>
</div>

<!-- MAIN -->
<div class="wrapper">

    <h1>Наша работа</h1>

    <div class="gallery">

        <!-- 1 -->
        <div class="item">
            <div class="img">
                <img src="/practice-2026/images/compos.jpg" alt="Композиция">
            </div>
            <div class="caption">Определение композиции</div>
        </div>

        <!-- 2 -->
        <div class="item">
            <div class="img">
                <img src="/practice-2026/images/maket.jpg" alt="Макеты">
            </div>
            <div class="caption">Макеты</div>
        </div>

        <!-- 3 -->
        <div class="item">
            <div class="img">
                <img src="/practice-2026/images/logojornal.jpg" alt="Логотип">
            </div>
            <div class="caption">Логотип</div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © Проектная деятельность 2026
</div>

</body>
</html>
